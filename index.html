<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Jornada dos Saberes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#10200f;--ink:#fff6dc;--pan:#2b1d10ee;--gold:#f5c518;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a160a}}
:root[data-theme="dark"]{--bg:#0a160a}
html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);display:grid;place-items:center;color:var(--ink);font-family:'Trebuchet MS',system-ui,sans-serif}
#app{position:relative;container-type:inline-size;width:min(100vw,calc(100vh*5/3));aspect-ratio:5/3;overflow:hidden;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.px{font-family:'Press Start 2P',monospace}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.1cqw;text-align:center}.scr.on{display:flex}
h1{margin:0;font-size:4.6cqw;color:var(--gold);text-shadow:.4cqw .4cqw 0 #7a1d12;line-height:1.3}h2{margin:0 0 1cqw;font-size:2cqw;color:var(--gold);text-align:center}
.sub{font-size:1.8cqw;margin:0;text-shadow:0 .2cqw .6cqw #000}.foot{font-size:1.2cqw;margin:0}
.b{font-family:'Press Start 2P',monospace;font-size:1.4cqw;color:var(--ink);background:linear-gradient(#9a6630,#5a3718);border:.3cqw solid var(--gold);padding:.9cqw 2cqw;cursor:pointer;min-width:22cqw}
.b:hover:not(:disabled){filter:brightness(1.25)}.b:disabled{opacity:.5;cursor:not-allowed}.b.sm{min-width:0;font-size:1cqw;padding:.4cqw .9cqw}
.box{background:var(--pan);border:.4cqw solid var(--gold);border-radius:.6cqw;padding:1.6cqw 2.6cqw;max-width:70cqw;max-height:92%;overflow:auto;font-size:1.6cqw;line-height:1.45;text-align:left}
.tag{font-size:1.1cqw;color:var(--gold);margin:.8cqw 0}.q{font-size:1.9cqw;margin:0 0 1cqw}
.opt{display:block;width:100%;margin:.5cqw 0;font-family:inherit;font-size:1.6cqw;text-align:left}.opt.ok{background:#2d7a2d}.opt.no{background:#8a2a2a}
.row{display:flex;gap:3cqw;align-items:center}.grp{display:flex;gap:.6cqw;align-items:center;margin:.5cqw 0;flex-wrap:wrap}.grp span{width:9cqw;font-size:1.4cqw}
.chip{font:inherit;font-size:1.3cqw;color:var(--ink);background:#4a3320;border:.2cqw solid #8a6a40;padding:.4cqw 1cqw;cursor:pointer}.chip.sel{background:var(--gold);color:#241405}
#pv{width:16cqw;height:16cqw;image-rendering:pixelated;background:#ffffff22;border:.3cqw solid var(--gold)}.nm{font:inherit;font-size:1.5cqw;padding:.6cqw;background:#2b1d10;color:var(--ink);border:.3cqw solid var(--gold);text-align:center}
#hud{position:absolute;top:.8cqw;left:.8cqw;right:.8cqw;display:none;justify-content:space-between;align-items:center;font-size:1.1cqw;text-shadow:.15cqw .15cqw 0 #000}#hud.on{display:flex}
#dlg{position:absolute;left:3%;right:3%;bottom:3%;display:none;background:var(--pan);border:.4cqw solid var(--gold);padding:1.2cqw 2cqw;font-size:1.8cqw;min-height:8cqw;cursor:pointer;line-height:1.4}#dlg.on{display:block}#dn{font-size:1.2cqw;color:var(--gold)}#dlg p{margin:.8cqw 0 0}
#toast{pointer-events:none;position:absolute;top:5cqw;left:50%;transform:translateX(-50%);background:#000c;border:.2cqw solid var(--gold);padding:.8cqw 1.6cqw;font-size:1.1cqw;display:none;white-space:nowrap}
.at{display:flex;gap:1cqw;align-items:center;margin:.4cqw 0}.at span{width:12cqw}.bar{height:1.2cqw;background:#0007;border:.15cqw solid #8a6a40;flex:1}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2d7a2d,var(--gold))}
.cd{position:relative;display:inline-flex;flex-direction:column;width:15cqw;height:23cqw;box-sizing:border-box;padding:.8cqw;border-radius:1cqw;border:.28cqw solid var(--k);background:linear-gradient(160deg,var(--b),#120a04 75%);text-align:center;font-size:1.15cqw;vertical-align:top;box-shadow:0 0 1cqw var(--k);transition:transform .3s}
.cd.r3,.cd.r4{animation:gl 2s infinite alternate}@keyframes gl{to{box-shadow:0 0 3cqw var(--k)}}
.cd .ct{display:flex;justify-content:space-between;color:var(--k);font-weight:bold;font-size:.9cqw}.cd em{font-style:normal;color:#ff9a7a}
.cd h3{font-family:'Press Start 2P',monospace;font-size:.85cqw;line-height:1.5;margin:.6cqw 0;min-height:2.6cqw}
.cd .art{height:7cqw;border-radius:.6cqw;border:.15cqw solid var(--k);background:radial-gradient(circle,var(--a),var(--b));display:grid;place-items:center;font-size:4cqw}
.cd .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.3cqw}.cd .vl{font-family:'Press Start 2P',monospace;font-size:.85cqw;line-height:1.6;color:var(--k)}.cd .qt{margin:0;font-size:1cqw;font-style:italic;opacity:.9}.cd .cg{font-family:'Press Start 2P',monospace;font-size:.7cqw;opacity:.8}
.unk{opacity:.5;filter:grayscale(1)}.neg{color:#ff9a7a}
.veil{position:absolute;inset:0;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw}
.pk{display:flex;gap:2cqw}.slot{cursor:pointer;transition:transform .35s,opacity .6s}.slot:hover{transform:translateY(-1cqw) scale(1.08)}.slot.sel{transform:scale(1.15)}.slot.gone{opacity:0;transform:scale(.6);pointer-events:none}
.cin{animation:cin .9s cubic-bezier(.2,.8,.3,1)}@keyframes cin{0%{transform:translateY(25cqw) scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:none}}
.col{display:flex;flex-wrap:wrap;gap:.4cqw;justify-content:center}.col .cd{width:11cqw;height:17cqw;font-size:.85cqw}

#dlg{border:.3cqw solid var(--gold);border-radius:1cqw;background:linear-gradient(#3a2815f5,#1c1209f5);box-shadow:0 1cqw 3cqw #000a,inset 0 0 0 .2cqw #ffffff22;padding:2.2cqw 2.6cqw 1.8cqw;animation:dIn .22s ease-out}@keyframes dIn{from{transform:translateY(2cqw);opacity:0}}
#dn{position:absolute;top:-1.5cqw;left:2cqw;background:var(--gold);color:#2a1605;padding:.6cqw 1.4cqw;border-radius:.6cqw;font-size:1.1cqw;box-shadow:0 .3cqw 0 #7a1d12}#dn:empty{display:none}
#dk{position:absolute;right:2cqw;bottom:.7cqw;font-size:.9cqw;color:var(--gold);font-style:normal;animation:bl 1s infinite steps(2)}@keyframes bl{50%{opacity:.2}}
#toast{border-radius:1cqw;background:linear-gradient(#2b1d10,#120a04);font-size:1.2cqw;box-shadow:0 0 1.5cqw #f5c51855}
#hud span{background:#000a;border:.15cqw solid #f5c51888;border-radius:.6cqw;padding:.4cqw .8cqw}#hud #hp{display:none}
#ban{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;display:none}#ban.on{display:block;animation:bn 1.5s both}
#ban b{display:block;font-size:2.6cqw;color:var(--gold);text-shadow:.3cqw .3cqw 0 #7a1d12,0 0 2cqw #f5c51888;background:linear-gradient(90deg,#0000,#000b 20%,#000b 80%,#0000);padding:1.4cqw 0}
#ban small{display:block;font-size:1.1cqw;color:#fff6dc;margin-top:.6cqw;background:#000b;padding:.6cqw 0}@keyframes bn{0%{opacity:0;transform:scaleY(.2)}12%,80%{opacity:1;transform:none}100%{opacity:0}}
.pop{position:absolute;left:50%;top:8cqw;font-size:1.8cqw;pointer-events:none;text-shadow:.2cqw .2cqw 0 #000;animation:pp 1.3s ease-out forwards}@keyframes pp{0%{opacity:0;transform:translate(-50%,2cqw) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-5cqw)}}
.logo{width:13cqw;height:13cqw;filter:drop-shadow(0 .6cqw 1.2cqw #000c) drop-shadow(0 0 2.5cqw #f5c518aa);animation:fl 4s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-.8cqw)}}
#menu{gap:.8cqw}#menu h1{font-size:3.2cqw}#menu .b{min-width:16cqw;font-size:1.2cqw;padding:.7cqw 1.4cqw}.mr{display:flex;gap:1.2cqw}input[type=range]{flex:1;accent-color:#f5c518}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* EVOLUÇÃO VISUAL — identidade, leitura e feedback sem tocar nas regras do jogo */
:root{--bg:#091b17;--ink:#f6f4e9;--pan:#10251fee;--gold:#f2c86a;--forest:#103d34;--mint:#7fe0bf;--line:#e9c774;--shadow:0 18px 48px #020b09bb;--focus:#a3f4d5;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%;background:radial-gradient(ellipse at 50% 0%,#235343 0,#102b25 45%,#071411 100%);overscroll-behavior:none}
body{padding:clamp(8px,2vw,28px);font-size:16px}
#app{width:min(calc(100vw - clamp(16px,4vw,56px)),calc((100dvh - clamp(16px,4vw,56px))*5/3));max-height:calc(100dvh - clamp(16px,4vw,56px));isolation:isolate;border:1px solid #f4d78a88;border-radius:clamp(10px,1.3cqw,20px);box-shadow:0 0 0 5px #06120f,0 0 0 6px #d8ad5570,0 26px 90px #000b;background:#0a211b;touch-action:manipulation}
#cv{z-index:0;filter:saturate(1.1) contrast(1.04)}

.scr{z-index:2;padding:clamp(14px,3cqw,34px);gap:clamp(8px,1.1cqw,15px);overflow:auto;scrollbar-color:#d8b45c #11251f;scrollbar-width:thin}
.scr#menu{background:linear-gradient(180deg,#07171330,#06141088 72%,#061410aa);gap:clamp(7px,1cqw,14px)}
.scr#menu::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:-1;width:min(86%,760px);height:min(92%,590px);border:1px solid #f2d38855;border-radius:24px;background:linear-gradient(145deg,#0c2923dc,#071712e8);box-shadow:0 22px 70px #0008,inset 0 1px 0 #ffffff16;backdrop-filter:blur(8px)}
.scr#menu .logo{width:clamp(80px,12cqw,148px);height:clamp(80px,12cqw,148px);filter:drop-shadow(0 8px 14px #0009) drop-shadow(0 0 22px #f0c65a88)}
h1{font-size:clamp(24px,3.2cqw,48px);letter-spacing:.055em;color:#ffdb82;text-shadow:0 2px 0 #684328,0 5px 22px #000b}
h2{font-size:clamp(17px,2cqw,30px);color:#ffdb82;letter-spacing:.035em;text-shadow:0 2px 14px #f1c96822}
.sub{font-size:clamp(13px,1.8cqw,22px);line-height:1.55}.foot{font-size:clamp(10px,1.1cqw,14px);letter-spacing:.12em;color:#e7dfc8}
.b{position:relative;overflow:hidden;isolation:isolate;min-width:clamp(142px,17cqw,250px);padding:clamp(11px,.9cqw,15px) clamp(15px,2cqw,28px);border:1px solid #ffdf91;border-radius:12px;background:linear-gradient(180deg,#b87e39,#70441f);box-shadow:0 4px 0 #462813,0 8px 18px #0005,inset 0 1px 0 #fff5;color:#fff8e9;font-size:clamp(11px,1.15cqw,16px);line-height:1.5;letter-spacing:.035em;text-shadow:0 1px 2px #39200f;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease,border-color .16s ease}
.b::after{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:linear-gradient(110deg,transparent 20%,#fff4 50%,transparent 80%);transform:translateX(-100%);transition:transform .45s ease,opacity .2s ease}
.b:hover:not(:disabled){filter:brightness(1.12) saturate(1.08);transform:translateY(-2px);box-shadow:0 6px 0 #462813,0 12px 24px #0006,inset 0 1px 0 #fff7}
.b:hover:not(:disabled)::after{opacity:1;transform:translateX(100%)}.b:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #462813,inset 0 2px 5px #0004}
.b:disabled{filter:grayscale(.55);box-shadow:none}.b.sm{min-width:0;font-size:clamp(10px,1cqw,13px);padding:7px 11px;border-radius:9px}
.box{width:min(88cqw,920px);max-width:92cqw;max-height:88%;padding:clamp(17px,2.1cqw,30px);border:1px solid #f0ca70;border-radius:18px;background:linear-gradient(150deg,#19382ff5,#0b201bf7);box-shadow:var(--shadow),inset 0 1px 0 #ffffff20;font-size:clamp(13px,1.35cqw,18px);line-height:1.65;scrollbar-color:#d8b45c #11251f;scrollbar-width:thin;backdrop-filter:blur(12px)}
#mod{z-index:7;padding:3cqw;overflow:auto;background:#020b09a8;backdrop-filter:blur(5px)}#mod .box{min-width:0!important;width:min(92cqw,920px)!important;max-width:92cqw;overflow-x:hidden}
#mod .box>h2:first-child{padding-bottom:.75em;border-bottom:1px solid #f2c86a55}
.q{font-size:clamp(16px,1.8cqw,24px);line-height:1.5}.tag{font-size:clamp(10px,1cqw,14px);letter-spacing:.13em;color:#f4d58c}
.opt{min-width:0;width:100%;font-family:inherit;font-size:clamp(13px,1.35cqw,18px);line-height:1.45;white-space:normal;border-radius:9px}
.row{gap:clamp(12px,2cqw,30px);flex-wrap:wrap;justify-content:center}.grp{gap:7px}.grp span{width:auto;min-width:clamp(78px,9cqw,125px);font-size:clamp(11px,1.15cqw,15px)}
.chip{font-size:clamp(11px,1.15cqw,15px);padding:7px 11px;border:1px solid #b49860;border-radius:8px;background:#1d3c33;transition:transform .15s,background .15s,box-shadow .15s}.chip:hover{transform:translateY(-1px);background:#315c4b}.chip.sel{background:#f2cf79;color:#1a251b;box-shadow:0 0 0 2px #f2cf7944}
.nm{max-width:90%;font-size:clamp(14px,1.4cqw,19px);border-radius:8px;background:#0b201c;border-color:#c5a45b}
#pv{width:clamp(96px,16cqw,190px);height:clamp(96px,16cqw,190px);border-radius:15px;border:2px solid #f2cf79;box-shadow:0 12px 28px #0006;background:radial-gradient(circle,#ffffff1b,#071611)}
#hud{z-index:4;top:clamp(7px,1cqw,14px);left:clamp(7px,1cqw,14px);right:clamp(7px,1cqw,14px);gap:8px;font-size:clamp(8px,1cqw,13px);align-items:flex-start}#hud span{max-width:45%;padding:8px 10px;border:1px solid #f1ce7588;border-radius:10px;background:linear-gradient(145deg,#081912eF,#102a23eF);box-shadow:0 5px 14px #0005;color:#f6e9c6;line-height:1.65;backdrop-filter:blur(7px)}#hud #hs{flex:1;max-width:none}#hud #hq{color:#b8f0cf}#hud .b{min-width:0;white-space:nowrap}
#dlg{z-index:6;left:3%;right:3%;bottom:3%;min-height:clamp(70px,9cqw,118px);padding:clamp(19px,2.2cqw,30px) clamp(18px,2.6cqw,36px);border:1px solid #f0cb75;border-radius:16px;background:linear-gradient(145deg,#193b30f5,#0b211bf7);box-shadow:0 14px 40px #000a,inset 0 1px 0 #ffffff20;font-size:clamp(14px,1.55cqw,21px);line-height:1.6;backdrop-filter:blur(10px)}#dn{top:-13px;left:20px;padding:7px 12px;border:1px solid #fff2;border-radius:8px;background:linear-gradient(#f8dc93,#d7a94a);color:#1c281e;font-size:clamp(10px,1cqw,14px);box-shadow:0 3px 0 #7a5424}#dk{right:18px;bottom:8px;font-size:clamp(9px,.85cqw,12px);color:#f3d985}
#toast{z-index:9;top:clamp(52px,6cqw,88px);max-width:90%;white-space:normal;text-align:center;padding:10px 16px;border:1px solid #f2d284;border-radius:12px;background:#09231ff2;font-size:clamp(10px,1.05cqw,14px);line-height:1.5;box-shadow:0 12px 35px #0009;backdrop-filter:blur(10px)}
#ban{z-index:8;top:32%}#ban b{font-size:clamp(21px,2.6cqw,38px);color:#ffdf8e;text-shadow:0 3px #70431f,0 0 25px #eabf59aa}#ban small{font-size:clamp(10px,1.1cqw,15px);line-height:1.55;color:#f8efd8}
.logo{animation:logo-float 4.2s ease-in-out infinite}@keyframes logo-float{to{transform:translateY(-6px) rotate(-1deg)}}
#menu .mr{gap:clamp(8px,1.2cqw,16px);flex-wrap:wrap;justify-content:center}#menu .b{min-width:clamp(130px,16cqw,220px);font-size:clamp(10px,1.05cqw,14px);padding:10px 16px}
.cd{border-radius:14px;box-shadow:0 10px 25px #0007,0 0 18px color-mix(in srgb,var(--k),transparent 58%)}.cd:hover{transform:translateY(-5px) rotate(-1deg)}

@media(max-width:700px){body{padding:8px}#app{border-radius:9px}.scr{padding:10px}.scr#menu::before{width:94%;height:96%;border-radius:16px}.scr#menu .logo{width:clamp(68px,13cqw,110px);height:clamp(68px,13cqw,110px)}#menu .b{min-width:clamp(120px,27cqw,200px)}.box{width:94cqw;max-width:94cqw;padding:14px;border-radius:13px}#mod{padding:2cqw}#mod .box{width:96cqw!important;max-width:96cqw}#hud{flex-wrap:wrap}#hud span{max-width:48%}#hud #hs{max-width:100%;flex-basis:100%;font-size:clamp(7px,.9cqw,10px);padding:5px 7px}#hud .b{margin-left:auto}#dlg{left:2%;right:2%;bottom:2%;padding:19px 15px 23px;min-height:65px;border-radius:11px}.row{gap:9px}.pk{flex-wrap:wrap;justify-content:center}.grp{gap:5px}.grp span{min-width:65px}}
@media(max-height:480px){body{padding:5px}.scr{padding:7px;gap:5px}.scr#menu .logo{width:clamp(56px,10cqw,90px);height:clamp(56px,10cqw,90px)}#menu .b{padding:6px 10px;min-width:clamp(108px,15cqw,180px)}.box{max-height:94%;padding:12px}.scr#menu::before{height:98%}#dlg{min-height:54px;padding:17px 14px 20px}}
@media(hover:none){.b:hover:not(:disabled),.chip:hover,.slot:hover{transform:none;filter:none}.b:active:not(:disabled),.chip:active{transform:scale(.98)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}


/* Progressão, emotes, desafio diário e conclusão de campanha */
#journeyToolsToggle{z-index:5;min-width:0!important;padding:8px 11px!important;font-size:clamp(8px,.95cqw,12px)!important;white-space:nowrap}
#journeyTools{position:absolute;z-index:8;top:clamp(47px,5.5cqw,76px);right:clamp(8px,1cqw,14px);display:none;gap:8px;padding:10px;border:1px solid #f0ce79;border-radius:13px;background:#0b211df2;box-shadow:0 12px 32px #0009;backdrop-filter:blur(10px)}
#journeyTools.on{display:flex;flex-wrap:wrap;justify-content:center}#journeyTools .b{min-width:0!important;font-size:clamp(9px,.9cqw,12px)!important;padding:8px 10px!important}
#emoteFX{position:absolute;z-index:5;display:none;pointer-events:none;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(24px,4cqw,54px);filter:drop-shadow(0 5px 9px #0009);animation:emoteRise .95s cubic-bezier(.2,.8,.2,1) both}
@keyframes emoteRise{0%{opacity:0;transform:translate(-50%,10px) scale(.45) rotate(-12deg)}18%{opacity:1;transform:translate(-50%,-5px) scale(1.16) rotate(5deg)}70%{opacity:1;transform:translate(-50%,-28px) scale(1)}100%{opacity:0;transform:translate(-50%,-56px) scale(.86)}}
#rankFX{position:absolute;z-index:9;left:50%;top:22%;display:none;transform:translateX(-50%);padding:12px 20px;border:1px solid #fff1b0;border-radius:14px;text-align:center;background:linear-gradient(130deg,#5c4317f5,#18352af5);color:#ffe9a8;box-shadow:0 0 30px #f3cf6b99;pointer-events:none;animation:rankReveal 2.8s ease both}
#rankFX b{display:block;font:clamp(11px,1.15cqw,15px) 'Press Start 2P',monospace;letter-spacing:.1em}#rankFX strong{display:block;margin-top:9px;font:clamp(12px,1.5cqw,20px) 'Press Start 2P',monospace}
